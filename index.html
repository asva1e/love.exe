#app,#app *{font-family:'Courier New',Consolas,Monaco,monospace!important}\n</style></head><body><div id="app"><canvas id="matrix"></canvas><div class="top"><span>◆ CONNECTION: UNVERIFIED</span><span>ACCESS: ROOT&nbsp; | &nbsp;THREAT LEVEL: CRITICAL</span></div><button class="mute" id="mute">SOUND: ON</button><main class="panel"><div class="line"></div><div class="screen" id="screen"></div><div class="progress"><i id="bar"></i></div><div id="controls"></div></main></div>
<script>
(()=>{const app=document.querySelector('#app'),screen=document.querySelector('#screen'),controls=document.querySelector('#controls'),bar=document.querySelector('#bar'),canvas=document.querySelector('#matrix'),ctx=canvas.getContext('2d');let sound=true,audio=null,cols=0,drops=[];
const wait=n=>new Promise(r=>setTimeout(r,n));function resize(){canvas.width=innerWidth;canvas.height=innerHeight;cols=Math.floor(canvas.width/17);drops=Array(cols).fill(1)}resize();addEventListener('resize',resize);
setInterval(()=>{ctx.fillStyle='rgba(5,5,6,.13)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle=app.classList.contains('green-mode')?'#55ff8677':'#ff263d77';ctx.font='12px monospace';drops.forEach((y,i)=>{ctx.fillText(String.fromCharCode(33+Math.random()*90),i*17,y*17);if(y*17>canvas.height&&Math.random()>.975)drops[i]=0;drops[i]++})},65);
function ac(){if(!audio){let A=window.AudioContext||window.webkitAudioContext;if(A)audio=new A()}if(audio?.state==='suspended')audio.resume();return audio}
function beep(f=650,d=.035,type='square',v=.014){if(!sound)return;let a=ac();if(!a)return;let o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}
function alarm(){beep(170,.22,'sawtooth',.04);setTimeout(()=>beep(115,.3,'sawtooth',.035),130)}
function heartbeat(){if(!sound)return;let a=ac();if(!a)return;let o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(72,a.currentTime);o.frequency.exponentialRampToValueAtTime(42,a.currentTime+.16);g.gain.setValueAtTime(.0001,a.currentTime);g.gain.linearRampToValueAtTime(.045,a.currentTime+.025);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.19);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.2);setTimeout(()=>{if(sound)beep(58,.13,'sine',.025)},230)}
document.querySelector('#mute').onclick=()=>{sound=!sound;document.querySelector('#mute').textContent='SOUND: '+(sound?'ON':'OFF');if(sound)ac()};
async function type(t,cls='',speed=40){screen.innerHTML='';let s=document.createElement('span');s.className=cls;screen.append(s);for(let i=0;i<t.length;i++){s.textContent+=t[i];if(t[i]!==' '&&t[i]!=='\n'&&i%2===0)beep(520+Math.random()*500,.018,'square',.01);await wait(t[i]==='\n'?150:speed)}return s}
function button(label,fn){controls.innerHTML='';let b=document.createElement('button');b.className='btn';b.textContent=label;b.onclick=fn;controls.append(b)}
async function boot(){

 let t=await type('UNAUTHORIZED ACCESS DETECTED\n\n','red',38);t.classList.add('glitch');alarm();await wait(650);
 await type('SCANNING USER...\n\nIDENTITY: DILARA\nLOCATION: ANKARA\n\nSEARCHING DATABASE...','red',40);
 bar.style.width='24%';await wait(650);
 screen.innerHTML='<div class="center"><div class="sub">GEOLOCATION // FLIGHT PATH ANALYSIS</div><div class="routebox"><svg viewBox="0 0 720 330" role="img" aria-label="İstanbul, Ankara ve Kıbrıs konumlarını gösteren uçuş rotası"><defs><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" class="map-grid" fill="none"/></pattern></defs><rect width="720" height="330" fill="url(#grid)"/><path class="map-land" d="M35 75l42-35 62 8 32 28 42-3 29 25-18 38-46 9-25 34-45-9-23-30-42-7z M285 28l50-19 45 21 12 35-30 24-48-12-38-21z M440 170l48-24 42 14 24 30-20 35-54 8-40-25z M515 238l36-12 32 20-15 24-44-5z"/><path class="route-path" d="M310 125 Q410 110 515 212 Q330 270 160 112"/><path d="M310 125 Q410 110 515 212 Q330 270 160 112" stroke="#ff9aa5" stroke-width="1.5" stroke-dasharray="3 7" fill="none" opacity=".75"/><circle class="route-dot" cx="160" cy="112" r="7"/><circle class="route-dot" cx="310" cy="125" r="7"/><circle class="route-dot" cx="515" cy="212" r="7"/><circle class="route-pulse" cx="310" cy="125" r="11"/><circle class="route-pulse cyprus" cx="515" cy="212" r="11"/><circle class="route-pulse istanbul" cx="160" cy="112" r="11"/><text x="160" y="88" fill="#fff" font-size="14" text-anchor="middle">ISTANBUL</text><text x="310" y="101" fill="#fff" font-size="14" text-anchor="middle">ANKARA</text><text x="515" y="241" fill="#fff" font-size="14" text-anchor="middle">CYPRUS</text><text x="400" y="78" fill="#ff9aa5" font-size="10" text-anchor="middle">FLIGHT PATH</text><text x="360" y="300" fill="#ff9aa5" font-size="10" text-anchor="middle">ANKARA → CYPRUS → ISTANBUL</text><text class="plane" x="0" y="0">✈<animateMotion dur="5s" repeatCount="indefinite" rotate="auto" path="M310 125 Q410 110 515 212 Q330 270 160 112"/></text></svg><div class="route-meta"><span>DEPARTURE: ANKARA</span><span>VIA: CYPRUS</span><span>ARRIVAL: ISTANBUL</span></div></div><div class="dim">FLIGHT PATH: ANKARA → CYPRUS → ISTANBUL</div></div>';
 await wait(3300);
 screen.classList.add('glitch');alarm();await wait(450);screen.classList.remove('glitch');
 screen.innerHTML='<div class="error"><div style="font-size:clamp(70px,17vw,130px);line-height:1;text-shadow:0 0 30px #ff263d">⚠</div><p>DATABASE MATCH FOUND</p></div>';await wait(650);
 await type('A VERY IMPORTANT PERSON\nHAS BEEN DETECTED.','red',48);await wait(1300);
 screen.style.opacity='0';await wait(350);screen.innerHTML='';screen.style.opacity='1';await wait(450);
 await type("RELAX, DILARA.\n\nYOU HAVEN'T BEEN HACKED.\n\nTHIS IS JUST ÜLKÜ.\nAND SHE HAS SOMETHING TO ASK YOU...",'white',48);
 bar.style.width='38%';await wait(500);button('[ CONTINUE ]',letterScene)
}
const message='Selam sevgilim. Yeterince özlediğimizi düşünüyorum. Zaman ilerledikçe bir yaş daha alıyoruz ve ben bundan sonra sadece seni istiyorum. Yaşanacak her zorluğa, her mesafeye katlanabilirim. Seninle bir gelecek kurup birbirimizi ileriye taşımak için her şeyi yapabilirim. Bana verdiğin güç sayesinde kendimi çok güçlü hissediyorum. Artık daha fazla zaman kaybetmek istemiyorum. Galata’ya birbirimizi bulma umuduyla değil, el ele tutuşarak çıkmalıyız. Seni seviyorum, seni sevmeyi seviyorum ve beni sevmeni seviyorum. Bence artık gelecekte bir şeyleri başardığımızda birbirimizi uzaktan izlemek yerine beraber kutlamalıyız. İyi ki benimlesin. Umarım her zaman benimle olmak istersin.';
async function letterScene(){
 controls.innerHTML='';bar.style.width='58%';
 screen.innerHTML='<span class="dim">[ MESSAGE_DECRYPTED.txt ]</span><br><br>';
 await wait(450);
 let p=document.createElement('div');p.className='letter';p.style.whiteSpace='pre-wrap';p.style.overflowWrap='break-word';screen.append(p);
 const cursor=document.createElement('span');cursor.className='type-cursor';p.append(cursor);
 async function writeInto(target,text,speed=32){
  for(let i=0;i<text.length;i++){
   cursor.before(document.createTextNode(text[i]));
   if(text[i]!==' '&&text[i]!=='\\n'&&i%2===0)beep(520+Math.random()*420,.025,'square',.012);
   await wait(text[i]==='.'||text[i]==='?'?240:text[i]===','?115:speed);
  }
 }
 async function eraseFromEnd(count){
  for(let i=0;i<count;i++){
   const node=cursor.previousSibling;
   if(!node)break;
   if(node.nodeType===Node.TEXT_NODE){
    if(node.textContent.length<=1)node.remove();
    else node.textContent=node.textContent.slice(0,-1);
   }else node.remove();
   beep(210+Math.random()*100,.018,'square',.009);
   await wait(38);
  }
 }
 // The note remains in one continuous terminal document.
 await writeInto(p,message,32);
 await wait(550);
 for(const phrase of ['\\n\\nSeni seviyorum.','\\n\\nSeni çok seviyorum.']){
  const addition=phrase;
  await writeInto(p,addition,42);
  await wait(850);
  await eraseFromEnd(addition.length);
  await wait(350);
 }
 await writeInto(p,'\\n\\nSana çok aşığım güzelim. ',42);
 const heart=document.createElement('span');heart.textContent='♥';heart.style.color='#ff6178';heart.style.textShadow='0 0 12px #ff263d';cursor.before(heart);
 // A silent pause lets the final sentence and heart land emotionally.
 await wait(1700);
 await proposalScene();
}

 noCount=0;app.classList.remove('stage3bg');

 screen.classList.add('glitch');await wait(180);screen.classList.remove('glitch');bar.style.width='82%';

async function error(){

 }
 await wait(noCount===3?2100:1500);
 // Every NO returns to the original proposal screen with the same two buttons.

 screen.style.opacity='0';await wait(280);
 screen.innerHTML='<div class="center"><div class="sub">ENCRYPTED TRANSMISSION // FINAL MESSAGE</div><div style="height:24px"></div><div class="big" style="font-size:clamp(24px,5vw,42px)">SENİ SEVİYORUM.</div><div style="height:12px"></div><div class="dim" style="font-size:11px;letter-spacing:.15em">ONE LAST QUESTION...</div><div style="height:24px"></div><div class="letter" style="font-size:clamp(25px,5.5vw,49px);font-weight:bold;line-height:1.45;color:#f4e9eb;text-shadow:0 0 15px #ff263d88">SEVGİLİM OLUR MUSUN?</div><div style="height:16px"></div><div class="sub">CEVABIN BEKLENİYOR</div><div class="sub" style="margin-top:14px;color:#ff6473">DENEME '+String(noCount).padStart(2,'0')+' / 03</div></div>';

}
async function finish(){
 controls.innerHTML='';bar.style.width='100%';screen.classList.remove('glitch');app.classList.remove('stage3bg');
 beep(520,.12,'sine',.012);await wait(1000);beep(740,.28,'sine',.012);await wait(450);

 screen.innerHTML='<div class="center error"><div style="font-size:clamp(52px,12vw,100px)">◈</div><h2>FINALIZING CONNECTION</h2><p>VERIFYING RESPONSE...</p></div>';
 beep(880,.12,'sine',.025);await wait(1000);
 screen.innerHTML='<div class="center"><div class="sub">INTRUSION TRACE DETECTED</div><div class="big">THREAT STILL ACTIVE</div><div class="dim">ISOLATING UNKNOWN CONNECTION...</div></div>';
 alarm();await wait(1250);
 screen.innerHTML='<div class="center"><div class="sub">INITIATING COUNTERMEASURES</div><div class="big">PURGING TRACE</div><div class="dim">RESTORING FIREWALL...<br>REBUILDING SECURITY PROTOCOLS...<br>SEALING CONNECTION...</div></div>';
 await wait(1450);
 screen.innerHTML='<div class="center"><div class="sub">SECURITY SCAN</div><div class="big">100% VERIFIED</div><div class="dim">NO THREATS FOUND<br>ALL SYSTEMS RECOVERED</div></div>';
 await wait(1050);screen.classList.remove('glitch');screen.style.opacity='0';await wait(600);
 app.classList.add('green-mode');
